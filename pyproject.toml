[project]
name = "learn-kitaru"
version = "0.1.0"
description = "Haystack + Kitaru tracing integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cohere-haystack>=9.2.0",
    "haystack-ai>=2.30.1",
    "kitaru[local]>=0.16.0",
    "nicegui>=3.15.0",
    "qdrant-haystack>=10.3.0",
    "sentence-transformers>=5.6.0",
    "transformers<5",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-dir]
"" = "src"
